name: Release validation and manual publishing

on:
  workflow_dispatch:
    inputs:
      destination:
        description: Validate only, or publish after the release gates are configured
        type: choice
        required: true
        default: validate
        options: [validate, testpypi, pypi]
      version:
        description: Optional expected version; must match pyproject.toml when supplied
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check release destination and version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install metadata tools
        run: python -m pip install -e '.[dev]'
      - name: Enforce publication gates
        env:
          DESTINATION: ${{ inputs.destination }}
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_PUBLISH_ENABLED: ${{ vars.RELEASE_PUBLISH_ENABLED }}
          RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY }}
        run: python scripts/release_checks.py --destination "$DESTINATION" --expected-version "$EXPECTED_VERSION"

  checks:
    name: Run CI and build the release artifacts
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish-testpypi:
    name: Publish checked artifacts to TestPyPI
    if: inputs.destination == 'testpypi'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Publish with the TestPyPI Trusted Publisher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: false

  publish-pypi:
    name: Publish checked artifacts to PyPI
    if: inputs.destination == 'pypi'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Publish with the PyPI Trusted Publisher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: false
